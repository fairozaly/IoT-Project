<!DOCTYPE html>
<html>
    <head>
        <title>Phone Scanner</title>
        <script src="../static/js/html5-qrcode.min.js"></script>
    </head>

    <h1>Scan Barcode To Send To Rpi</h1>
    <div id="reader" style="width: 100%; max-width: 800px; margin: auto;"></div>
    <h3 id="resultText">NOTHING SCANNED YET</h3>

    <!-- Cart -->
    <div id="cart">
        <div class="example-item">
            <div class="item-name-container">
                <span class="item-name">SampleProduct</span>
            </div>
            <div class="item-quantity-container">
                <span class="item-quantity">123</span>
                <button class="remove-item">-</button>
            </div>
            <div class="item-price-container">
                <span class="item-price">3030$</span>
            </div>
        </div>
    </div>
    <div id="cart-total-container">
        <span id="cart-total"></span>
    </div>

    <script src="../static/js/checkout.js"></script>    
</html>
