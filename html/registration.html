<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration</title>
<link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="registration-page">
<nav>
  <a class="back-nav" href="customers.html">&larr; Back</a>
  <div class="nav-links">
    <a href="#">Inventory</a>
    <a href="registration.html" class="active">Customers</a>
    <a href="#">Settings</a>
  </div>
  <div class="nav-buttons">
    <button type="button" id="themeToggle" aria-label="Enable dark mode">Dark mode</button>
  </div>
</nav>
<div class="page">
  <h1>Registration</h1>
  <p class="subhead">Add a client</p>

  <form id="clientForm">
    <div class="field">
      <label for="firstName">First Name</label>
      <input id="firstName" name="firstName" type="text" required>
    </div>
    <div class="field">
      <label for="lastName">Last Name</label>
      <input id="lastName" name="lastName" type="text" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
    </div>
    <button type="submit" id="submitBtn">Submit</button>
  </form>

</div>


<div class="overlay" id="successOverlay">
  <div class="modal">
    <iframe class="result-frame" src="success.html" title="Registration success"></iframe>
  </div>
</div>


<div class="overlay" id="errorOverlay">
  <div class="modal">
    <iframe class="result-frame" src="error.html" title="Registration error"></iframe>
  </div>
</div>
<script>
  const form = document.getElementById("clientForm");
  const successOverlay = document.getElementById("successOverlay");
  const errorOverlay = document.getElementById("errorOverlay");
  const themeToggle = document.getElementById("themeToggle");
  const resultFrames = document.querySelectorAll(".result-frame");

  function syncResultFrameTheme(isDarkMode) {
    resultFrames.forEach((frame) => {
      if (frame.contentDocument) {
        frame.contentDocument.body.classList.toggle("dark-mode", isDarkMode);
      }
    });
  }

  function closeModals() {
    successOverlay.classList.remove("open");
    errorOverlay.classList.remove("open");
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    successOverlay.classList.add("open");
  });

  const darkModeEnabled = localStorage.getItem("darkMode") === "true";
  document.body.classList.toggle("dark-mode", darkModeEnabled);
  resultFrames.forEach((frame) => {
    frame.addEventListener("load", () => {
      syncResultFrameTheme(document.body.classList.contains("dark-mode"));
    });
  });
  syncResultFrameTheme(darkModeEnabled);
  themeToggle.textContent = darkModeEnabled ? "Light mode" : "Dark mode";
  themeToggle.setAttribute("aria-label", darkModeEnabled ? "Disable dark mode" : "Enable dark mode");
  themeToggle.addEventListener("click", () => {
    const isDarkMode = document.body.classList.toggle("dark-mode");
    localStorage.setItem("darkMode", isDarkMode);
    syncResultFrameTheme(isDarkMode);
    themeToggle.textContent = isDarkMode ? "Light mode" : "Dark mode";
    themeToggle.setAttribute("aria-label", isDarkMode ? "Disable dark mode" : "Enable dark mode");
  });
</script>
</body>
</html>
