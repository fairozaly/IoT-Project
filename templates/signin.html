<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %} · Smart Store</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <h1>{{ self.title() }}</h1>
      <p>The email you sign in with receives fan approval requests.</p>
      {% if error %}<p role="alert">{{ error }}</p>{% endif %}
      <form method="post">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="email" required maxlength="254" value="{{ request.form.get('email', '') }}">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="{% block password_autocomplete %}current-password{% endblock %}" required minlength="8">
        <button type="submit">{{ self.title() }}</button>
      </form>
      {% block switch %}<p>Need an account? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>{% endblock %}
    </section>
  </main>
</body>
</html>
