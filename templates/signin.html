<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %} · Smart Store</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <h1>{{ self.title() }}</h1>
      <p>Sign in to access your customer account or staff tools.</p>
      {% if error %}<p id="signin-error" class="auth-error" role="alert" tabindex="-1">{{ error }}</p>{% endif %}
      <form method="post">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="email" required maxlength="254" value="{{ request.form.get('email', '') }}"{% if error %} aria-invalid="true" aria-describedby="signin-error"{% endif %}>
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="{% block password_autocomplete %}current-password{% endblock %}" required minlength="8"{% if error %} aria-invalid="true" aria-describedby="signin-error"{% endif %}>
        <button type="submit">{{ self.title() }}</button>
      </form>
      {% if not session.get('user_id') %}
      <p><a href="{{ url_for('checkout') }}">Continue to self-checkout as a guest</a></p>
      {% endif %}
      <p>Shopping here? <a href="{{ url_for('auth.customer_signup') }}">Create a customer account</a></p>
    </section>
  </main>
</body>
</html>
